<!doctype html>
<!-- No theme class here: `color-scheme: light dark` in index.css follows the OS, and
     public/theme-init.js stamps `light`/`dark` before first paint only when the user has pinned
     one. The cascade decides, not the markup. --><html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Blocking, and first: the pin class must be on <html> before anything paints. Same-origin,
         so `script-src 'self'` already allows it. -->
    <script src="/theme-init.js"></script>
    <!-- Browser chrome follows the OS for System users. useTheme rewrites these at runtime for
         someone who has pinned the opposite of their OS. Both are --background's halves exactly
         (index.css), so the status bar, the header and the page are one colour. -->
    <meta name="theme-color" content="#f7f7f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161617" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Opaque, not black-translucent: on iOS 26 and later a home-screen app drawn under the status
         bar is laid out one status bar short of the bottom edge (other PWAs report the same, and no
         CSS reaches the band), which left the composer ~60pt above the home indicator. iOS reads
         this tag when the app is added to the Home Screen, so an installed Nenu keeps its old bar
         until it is removed and added again. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nenu" />
    <title>Nenu</title>
    <!-- The web manifest <link> is injected by vite-plugin-pwa at build time. -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/nenu-apple-touch-icon.png" />
    <!-- First-paint splash, bridging the OS launch splash and React mount (createRoot replaces
         #root, so it clears itself). Its mark and caption stay hidden for the first second: a load
         that quick goes from the page's background straight to routes/root.tsx's BootSplash, the
         app's own frame, so there is one boot screen. Only a slow bundle (a cold cache on a slow
         link) shows them. Critical CSS is inlined so it paints before the app bundle/index.css
         load — pure CSS, no JS. -->
    <style>
      /* index.css has not loaded at this point, so the splash declares `color-scheme` itself —
         otherwise light-dark() below has nothing to resolve against and every value falls to its
         light branch. These three rules mirror index.css exactly; keep them in step. */
      :root {
        color-scheme: light dark;
      }
      :root.light {
        color-scheme: light;
      }
      :root.dark {
        color-scheme: dark;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        /* --background and --muted-foreground, copied because index.css has not loaded yet. Any
           other value steps the page on hand-off to React (it once went white to rgb(245), and the
           caption sat at 3.45:1). design-system.test.ts holds the background to the token. */
        background: light-dark(#f7f7f7, #161617);
        color: light-dark(#55555a, #b4b4b9);
        font: 500 0.875rem/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .boot-splash > * {
        animation: boot-splash-late 1s;
      }
      .boot-splash__dog {
        width: 4rem;
        height: 4rem;
        object-fit: contain;
        animation: boot-splash-late 1s, boot-nenu-breathe 1.15s ease-in-out 1s infinite;
      }
      @media (prefers-color-scheme: dark) {
        :root:not(.light) .boot-splash__dog { filter: invert(1); }
      }
      :root.dark .boot-splash__dog { filter: invert(1); }
      @keyframes boot-splash-late {
        from, to { visibility: hidden; }
      }
      @keyframes boot-nenu-breathe {
        0%, 100% { transform: translateY(0) scale(0.96); opacity: 0.72; }
        50% { transform: translateY(-3%) scale(1); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash__dog {
          animation: boot-splash-late 1s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-label="Loading Nenu">
        <img class="boot-splash__dog" src="/nenu-mark.png" alt="" aria-hidden="true">
        <span>Connecting to the herd…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
